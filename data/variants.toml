# Variantenregister Formgen v2 (einzige Eintragsstelle; Prinzip aus Formgen v1 variants.py).
# Eine Variante ist eine Gestaltungslinie über alle 17 BALLON-Typen: Blatt-ID = "B" + Buchstabe + BASIC-Nummer (BA01 … BA17).
# IDs und Namen sind ab Vergabe ewig. Neue Variante nur über `python -m formgen.variants new …` (prüft die Namensregel).
# Parameter sind Vorgaben (Herkunft „Vorgabe Variantenregister“); Werkzeuge und Grenzen: docs/generator.md.
# Schema 2 (0.4): `base` (pilot | standard | v21) und Bereiche – Zahl als [von, bis], Baustein als Liste; gezogen je Blatt aus dem Seed.
# 0.6 (Nutzerentscheid 242): alle Linien auf `base = "pilot"` = neuester BALLON-Spielpilot basic/pilot/wNN_*_vK.py; ohne Piloten
# (BASIC-16/17) bleibt die Formstudie, im Blatt als „Formstudie – kein Pilot“ gekennzeichnet.
schema = 2

[[variants]]
letter = "A"
name = "Baseline"
idea = "BALLON-Spielpilot unverändert; Bezug für alle weiteren Linien"
since = "0.2"
skin = "standard"
base = "pilot"
[variants.params]

