# Register der Roboter, wie data/variants.toml bei den Waffen: Blatt = Linie × Basic-Typ, Blatt-ID R<Linie><NN> (RA01, später RA02).
# [[types]]: Basic-Typen mit eigenem Modellmodul unter formgen/models/robot/ (Schnittstelle siehe docs/robot.md).
# [[lines]]: Kennbuchstabe A–Z ohne I/O, englischer Name 1–3 Wörter ≤ 16 Zeichen, gilt für die genannten Typen; `params.<num>` überschreibt
# nur vorhandene Schlüssel von PARAMS des Typs. Vergebene IDs sind ewig; R01 und R02 (Contour) bleiben reserviert.
# Version 2 (0.14 Kitbash): `[lines.parts]` wählt je Einzelteil eine Variante aus dem Baukasten formgen/models/robot/catalog (ID `<Kürzel>-<Buchstabe>`,
# z. B. shoulders = "SH-C"); fehlende Einzelteile bleiben bei der Grundform A. Version 1 ohne `version` wird beim Laden migriert (formgen/robot/lines.py).
schema = "formgenv2/robot-register"
version = 2

[[types]]
num = 1
name_de = "RoboterBasic-01"
module = "formgen.models.robot.roboterbasic_01"
since = "0.9"

[[types]]
num = 2
name_de = "RoboterBasic-02"
module = "formgen.models.robot.roboterbasic_02"
since = "0.11"

[[lines]]
letter = "A"
name = "Basic"
since = "0.9"
idea = "Grundform der Basic-Typen, ohne Abwandlung"
skin = "weiss_graphit"
types = [1, 2]

# 0.12 Livery: vier Farblinien. 0.13 Gantry: dazu je Linie eigene Bauteilproportionen (`proportion`: Schultern, Rumpf, Beine, Rückenmodul; Faktoren auf die Profile,
# 1,0 = Vorgabe, Grenzen 0,7–1,4 in formgen/models/robot/proportion.py) und `arm_bulk`. Alle Werte Annahme, am Vielfaltsmaß (`python -m formgen.robot.variety`) und am Bild gesichtet.
