# EXTENDED-Linienregister Formgen v2 (0.38 „Foundry“, einzige Eintragsstelle; Prinzip wie data/variants.toml).
# Eine Linie ist eine Gestaltungslinie über alle 17 EXTENDED-Modelle: Blatt-ID = "E" + Buchstabe + EXTENDED-Nummer (EB01 … EM17);
# Linie A ist das EXTENDED-Modell selbst (EA01 … EA17). IDs und Namen sind ab Vergabe ewig.
# Neue Linie nur über `python -m formgen.extended_lines new …` (Namensregel wie BASIC, kein Name einer BASIC-Linie).
# Parameter: nur Eingriffe, die die eigene Silhouette erhalten (formgen/extended_lines.py OPS), Grenzen wie BASIC (variants.PARAMS);
# Zahl als [von, bis] wird je Blatt aus dem eigenen Seed gezogen. Herkunft der Zahlen: Vorgabe dieses Registers (Entwurf 0.38).
schema = 1

