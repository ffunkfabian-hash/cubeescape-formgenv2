# Volle Testsuite als PR-Check (Nutzer 07.11.2026, ersetzt Entscheidung 301). Öffentliches Repo: Standard-Linux-Runner
# kosten keine Minuten - globale Regel "GitHub Actions sparsam". Führt die Befehle aus `.ce-repo.json` › check.quick aus
# (./ce check) mit BALLON am gepinnten Commit aus config.toml; Blender-, GPU- und Bildstufen (FORMGEN_RENDER_TESTS,
# FORMGEN_GOLDEN_IMAGES) bleiben beim Nachtlauf auf dem Mac. Push nur auf main, andere Branches über ihren Pull Request,
# Doku löst nichts aus. Lokal braucht die Suite etwa 20 min, daher 45 min Timeout.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Derselbe Commit wie .ce-repo.json › tools_version (0.42.0)
      - uses: ffunkfabian-hash/ce-agent-tools/.github/actions/ce-tools@e1c2ddfe53d4b340dd662ddb65add62ca327b161
      - name: BALLON (gepinnter Commit aus config.toml, nur gelesen)
        run: |
          commit=$(sed -n 's/^commit = "\(.*\)"/\1/p' config.toml | head -1)
          git clone -q https://github.com/ffunkfabian-hash/cubeescape-ballon.git "$RUNNER_TEMP/ballon"
          git -C "$RUNNER_TEMP/ballon" checkout -q "$commit"
          echo "FORMGEN_BALLON_REPO=$RUNNER_TEMP/ballon" >> "$GITHUB_ENV"
      - name: Abhängigkeiten (.venv wie check.quick erwartet)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: check.quick aus .ce-repo.json
        run: ./ce check
