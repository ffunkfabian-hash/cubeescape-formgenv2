# Schnellprüfung als PR-Check. Öffentliches Repo: Standard-Linux-Runner kosten keine Minuten - globale Regel
# "GitHub Actions sparsam". Führt die Befehle aus `.ce-repo.json` › check.quick aus (./ce check); Blender-, Bild- und
# Mac-Stufen bleiben beim Nachtlauf auf dem Mac. Push nur auf main, andere Branches über ihren Pull Request, Doku löst nichts aus.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: ffunkfabian-hash/ce-agent-tools/.github/actions/ce-tools@e85688c492c4006f914f7edfad6f13d028d911a9
      - name: Abhängigkeiten (.venv wie check.quick erwartet)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: check.quick aus .ce-repo.json
        run: ./ce check
